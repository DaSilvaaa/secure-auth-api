# Plano gratuito: a instância adormece após ~15 min sem tráfego (1.º pedido demora ~1 min)
# e o SQLite é efémero (os dados perdem-se em cada deploy/reinício). Serve para demos.
# Para produção: plano pago com disco persistente, ou PostgreSQL.
services:
  - type: web
    name: secure-auth-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
